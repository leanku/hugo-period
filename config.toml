# ============================================================
# Period 主题示例站（exampleSite 分支）
# 运行方式（本分支根目录）：
#   git submodule update --init --recursive   # 首次拉取主题 submodule
#   hugo server -D                            # 预览
# 说明：主题通过 submodule 挂在 themes/period/，用默认配置即可。
# ============================================================

baseURL = "https://example.org/"
title = "Period 主题演示"
locale = "zh-cn"
defaultContentLanguage = "zh-cn"
theme = "period"
paginate = 6
enableRobotsTXT = true
enableEmoji = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions]
      definitionList = true
      taskList = true
  [markup.highlight]
    codeFences = true
    noClasses = false
    lineNos = true
    lineNumbersInTable = false
    style = "onedark"
    tabWidth = 4

[taxonomies]
  category = "categories"
  tag = "tags"
  author = "author"

[permalinks]
  post = "/:sections/:slug/"

[pagination]
  pagerSize = 6

[params]
  tagline     = "记录设计、代码与生活的个人博客。"
  description = "Period Hugo 主题演示站。"
  author      = "Period"
  dateFormat  = "2006年1月2日"
  layout        = "right"
  fullPost      = false
  excerptLength = 40
  readMoreText  = "阅读更多"
  displayAuthor = true
  displayDate   = true
  lastUpdated   = true
  scrollToTop   = true
  logo      = ""
  logoSize  = 168
  searchBar = true
  footerText = "Period Hugo 主题，移植自 Compete Themes 的 Period WordPress 主题。"
  googleFonts = true
  fontFamily  = "Roboto:300,300italic,400,700"
  fontSubsets = "latin,latin-ext"

  [params.social]
    rss = "/index.xml"
    # github  = "https://github.com/yourname"
    # email   = "mailto:you@example.com"

  [params.sidebar]
    recentPosts     = 5
    categories      = true
    categoriesLimit = 5
    tags            = true
    tagsLimit       = 10
    archives        = true
    [params.sidebar.about]
      name  = "Period"
      image = "images/avatar.jpg"
      text  = "[Hugo](https://gohugo.io) 主题。复制本演示站到你的仓库即可开始写作。"
    [params.sidebar.links]
      limit = 5
      [[params.sidebar.links.items]]
        name        = "Hugo"
        url         = "https://gohugo.io"
        author      = "gohugoio"
        description = "世界最快的静态站点生成器。"
      [[params.sidebar.links.items]]
        name        = "PaperMod"
        url         = "https://github.com/adityatelange/hugo-PaperMod"
        author      = "Aditya Telange"
        description = "简洁、快速、支持多语言的 Hugo 主题。"

  [params.comments]
    provider   = "none"          # none | giscus | utterances（见主题 README）
    repo       = "yourname/your-repo"
    repoId     = "R_kgDOxxxxxxx"
    category   = "Announcements"
    categoryId = "DIC_kwDOxxxxxxx"
    theme      = "light"

  [params.search]
    provider    = "pagefind"
    placeholder = "搜索…"

  [params.contactForm]
    provider = "none"
    endpoint = ""

  [params.seo]
    publisherType      = "Organization"
    keywords           = []
    logo               = "images/favicon.svg"
    favicon            = "images/favicon.svg"
    appleTouchIcon     = "images/favicon.svg"
    themeColor         = "#333333"
    enableOpenGraph    = true
    enableTwitterCards = true
    enableSchema       = true
    alwaysInclude      = false
    [params.seo.verification]
      google = ""
      bing   = ""
      yandex = ""
      naver  = ""

[menu]
  [[menu.main]]
    name       = "主页"
    url        = "/"
    weight     = 1
    identifier = "home"
  [[menu.main]]
    name       = "归档"
    url        = "/archives/"
    weight     = 4
    identifier = "archives"
  [[menu.main]]
    name       = "搜索"
    url        = "/search/"
    weight     = 5
    identifier = "search"
  [[menu.main]]
    name       = "关于"
    url        = "/about/"
    weight     = 6
    identifier = "about"
  [[menu.main]]
    name       = "联系"
    url        = "/contact/"
    weight     = 7
    identifier = "contact"
  [[menu.main]]
    name       = "RSS"
    url        = "/index.xml"
    weight     = 8
    identifier = "rss"
