# 将 exampleSite 分支示例站部署到 GitHub Pages
# 站点地址：https://<owner>.github.io/hugo-period/
# 启用方式：仓库 Settings → Pages → Source 选 "GitHub Actions"
#
# 参照 PaperMod 的分支方案：示例站独立为 exampleSite 分支（标准 Hugo 站点，
# 主题以 submodule 挂在 themes/period/），本 workflow 检出该分支并拉取 submodule 构建。

name: Deploy exampleSite to GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # 示例站部署路径（项目页）。若部署到用户页（<owner>.github.io 仓库），改为 "https://<owner>.github.io/"
  BASE_URL: "https://leanku.github.io/hugo-period/"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exampleSite branch
        uses: actions/checkout@v4
        with:
          ref: exampleSite        # 检出示例站分支

      - name: Get Theme (submodule)
        run: git submodule update --init --recursive

      - name: Update theme to latest commit
        run: git submodule update --remote --merge

      - name: Setup Node (Pagefind)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Hugo (extended)
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.165.0"
          extended: true

      - name: Build with Hugo
        run: hugo --minify --baseURL "${{ env.BASE_URL }}"

      - name: Build Pagefind index
        run: npx pagefind --site public

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
