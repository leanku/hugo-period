{{ define "main" }}
<div class="entry">
  <article>
    <div class="post-container">
      <div class="post-header">
        <h1 class="post-title">{{ .Title }}</h1>
      </div>
      <div class="post-content">
        {{ .Content }}
        <ul class="links-list">
          {{ range site.Params.sidebar.links.items }}
          <li class="link-item">
            <a class="link-name" href="{{ .url }}" target="_blank" rel="noopener">{{ .name }}</a>
            {{ with .description }}<p class="link-desc">{{ . }}</p>{{ end }}
            {{ with .author }}<p class="link-author">{{ i18n "byAuthor" (dict "name" .) }}</p>{{ end }}
          </li>
          {{ end }}
        </ul>
      </div>
    </div>
  </article>
</div>
{{ end }}
