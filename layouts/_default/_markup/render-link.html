{{- $isExternal := and (strings.HasPrefix .Destination "http") (not (strings.Contains .Destination .Page.Permalink)) -}}
<a href="{{ .Destination | safeURL }}" 
   {{- with .Title }} title="{{ . }}"{{- end -}}
   {{- if $isExternal -}}
     target="_blank" rel="noopener noreferrer"
   {{- end -}}>
  {{- .Text | safeHTML -}}
</a>
