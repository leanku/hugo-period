{{/* 评论（对应 comments_template）：Giscus / Utterances / none
    注意：giscus 的 client.js 只从 <script> 标签自身的 data-* 属性读取配置（见官方片段），
    配置必须放在 script 标签上，而不是 .giscus div 上（client.js 会自行创建该 div）。
    显示条件：文章（mainSections 内）默认显示；普通页面 front matter 写 comments: true 也显示；
    provider = "none" 时始终不渲染。*/}}
{{ $provider := site.Params.comments.provider | default "none" }}
{{ $show := or (in (site.Params.mainSections | default (slice "posts")) .Type) .Params.comments }}
{{ if and $show (ne $provider "none") }}
<section id="comments" class="comments-area">
  <h2 class="screen-reader-text">{{ i18n "leaveComment" }}</h2>
  {{ if eq $provider "giscus" }}
  <script src="https://giscus.app/client.js"
          data-repo="{{ site.Params.comments.repo }}"
          data-repo-id="{{ site.Params.comments.repoId }}"
          data-category="{{ site.Params.comments.category | default "Comments" }}"
          data-category-id="{{ site.Params.comments.categoryId }}"
          data-mapping="pathname"
          data-strict="0"
          data-reactions-enabled="1"
          data-emit-metadata="0"
          data-input-position="bottom"
          data-theme="{{ site.Params.comments.theme | default "light" }}"
          data-lang="zh-CN"
          data-loading="lazy"
          crossorigin="anonymous"
          async>
  </script>
  {{ else if eq $provider "utterances" }}
  <script src="https://utteranc.es/client.js"
          repo="{{ site.Params.comments.repo }}"
          issue-term="pathname"
          label="comment"
          theme="{{ site.Params.comments.theme | default "github-light" }}"
          crossorigin="anonymous"
          async></script>
  {{ end }}
</section>
{{ end }}
