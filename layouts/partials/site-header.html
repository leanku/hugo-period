<header class="site-header" id="site-header" role="banner">
  <div class="max-width">
    <div id="title-container" class="title-container">
      {{ partial "logo.html" . }}
      {{ with site.Params.tagline }}<p class="tagline">{{ . }}</p>{{ end }}
    </div>
    <button id="toggle-navigation" class="toggle-navigation" name="toggle-navigation" aria-expanded="false" data-open-text="{{ i18n "openMenu" }}" data-close-text="{{ i18n "closeMenu" }}">
      <span class="screen-reader-text">{{ i18n "openMenu" }}</span>
      <svg width="36px" height="23px" viewBox="0 0 36 23" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
        <desc>mobile menu toggle button</desc>
        <g stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
          <g transform="translate(-142.000000, -104.000000)" fill="#FFFFFF">
            <g transform="translate(142.000000, 104.000000)">
              <rect x="0" y="20" width="36" height="3"></rect>
              <rect x="0" y="10" width="36" height="3"></rect>
              <rect x="0" y="0" width="36" height="3"></rect>
            </g>
          </g>
        </g>
      </svg>
    </button>
    <div id="menu-primary-container" class="menu-primary-container">
      <div class="icon-container">
        {{ partial "social.html" . }}
        {{ partial "search.html" . }}
      </div>
      {{ partial "menu.html" . }}
    </div>
  </div>
</header>
