<section class="widget widget_tag_cloud">
  <h3 class="widget-title">
    <span class="widget-title-text">{{ i18n "tags" }}</span>
    <a class="widget-more" href="{{ "tags/" | relURL }}">{{ i18n "more" }}</a>
  </h3>
  <div class="tagcloud">
    {{ $limit := int (site.Params.sidebar.tagsLimit | default 10) }}
    {{ range first $limit site.Taxonomies.tags.ByCount }}
    <a href="{{ .Page.RelPermalink }}">{{ .Page.LinkTitle }}</a>
    {{ end }}
  </div>
</section>
