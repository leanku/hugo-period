<section class="widget widget_recent_entries">
  <h3 class="widget-title">{{ i18n "recentPosts" }}</h3>
  <ul>
    {{ $n := int (site.Params.sidebar.recentPosts) }}
    {{ range first $n (partial "post-pages.html" .) }}
    <li>
      <a href="{{ .RelPermalink }}">{{ .Title }}</a>
    </li>
    {{ end }}
  </ul>
</section>
