{{/* 列表卡片评论链接（对应 content/comments-link.php）：
    与 demo 一致显示"发表评论"；配置了评论服务时链接到 #comments，否则为纯文本 */}}
{{ $provider := site.Params.comments.provider | default "none" }}
<span class="comments-link">
  <i class="fas fa-comment" aria-hidden="true" title="comment icon"></i>
  {{ if ne $provider "none" }}
  <a href="{{ .RelPermalink }}#comments">{{ i18n "leaveComment" }}</a>
  {{ else }}
  {{ i18n "leaveComment" }}
  {{ end }}
</span>
